name: Build & Release

# Тригери:
#   1. Push з тегом v*.*.* (e.g. v1.0.1) — повний реліз з GitHub Release + latest.json
#   2. Push у main — тільки збірка (артефакти у Actions, не реліз)
#   3. workflow_dispatch — ручний запуск з UI Actions
on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  workflow_dispatch:

# Якщо запушили новий commit/тег ДО завершення попереднього run'у — скасувати
# попередній. Економить хвилини на rapid-iter (наприклад push v1.0.20 поки v1.0.19
# ще білдиться). Тег-релізи теж зберігаються бо github.ref у них унікальний.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Витягуємо версію з тегу або з package.json ───────────────────────────────
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version:    ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./builds/electron/package.json').version")
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "Resolved version: ${VERSION}"

  # ── Windows .exe ─────────────────────────────────────────────────────────────
  build-windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version into package.json and iss
        shell: pwsh
        run: |
          $v = "${{ needs.resolve-version.outputs.version }}"
          # package.json
          $pkg = Get-Content builds\electron\package.json -Raw | ConvertFrom-Json
          $pkg.version = $v
          $pkg | ConvertTo-Json -Depth 10 | Set-Content builds\electron\package.json -Encoding utf8NoBOM
          # setup_electron.iss
          (Get-Content builds\electron\setup_electron.iss) `
            -replace '#define MyAppVersion\s+".*"', "#define MyAppVersion   `"$v`"" `
            | Set-Content builds\electron\setup_electron.iss
          # UI badge
          (Get-Content index.html) `
            -replace 'id="versionBadge">v[^<]+', "id=`"versionBadge`">v$v" `
            | Set-Content index.html

      - name: Create config.py from secrets
        shell: pwsh
        run: |
          # ADMIN_PASSWORD з GitHub secret НЕ кладемо в .exe як plaintext.
          # Обчислюємо SHA-256 hex digest. Reverse-engineer бачить лише хеш —
          # відновити пароль = bruteforce (для 26-char зі спецсимволами це роки).
          $bytes = [System.Text.Encoding]::UTF8.GetBytes('${{ secrets.ADMIN_PASSWORD }}')
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $hashBytes = $sha.ComputeHash($bytes)
          $hashHex = -join ($hashBytes | ForEach-Object { $_.ToString('x2') })
          Write-Host "[config] ADMIN_PASSWORD_HASH computed (${hashHex.Substring(0,12)}...)"

          $lines = @(
            "BOT_TOKEN           = `"${{ secrets.BOT_TOKEN }}`"",
            "ADMIN_CHAT_ID       = `"${{ secrets.ADMIN_CHAT_ID }}`"",
            "HMAC_SECRET         = `"${{ secrets.HMAC_SECRET }}`"",
            "ADMIN_PASSWORD_HASH = `"$hashHex`""
          )
          $lines | Out-File -FilePath config.py -Encoding utf8NoBOM

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pyinstaller pillow

      # Кеш ZIP з FFmpeg-бінарниками. Ключ прив'язаний до URL — поки BtbN
      # publish'ить під 'latest' тегом, ключ не змінюється, кеш hit.
      # При новому BtbN-релізі — можна руками інкрементнути cache-key-version.
      - name: Cache FFmpeg binaries
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: builds\electron\ffmpeg
          key: ffmpeg-btbn-latest-v2

      - name: Download FFmpeg (real binaries, not chocolatey shim)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # ВАЖЛИВО: choco install ffmpeg ставить shim (~400KB) який потім
          # не запускається без оригіналу. Завантажуємо ПРЯМО справжні бінарники
          # з офіційного BtbN/FFmpeg-Builds — це industry-standard Windows-збірка.
          $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $extract = "$env:RUNNER_TEMP\ffmpeg-extract"
          Write-Host "Downloading FFmpeg from $url ..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Write-Host "Extracting ..."
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          New-Item -ItemType Directory -Path "builds\electron\ffmpeg" -Force | Out-Null
          $ffmpegBin = Get-ChildItem -Path $extract -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobeBin = Get-ChildItem -Path $extract -Recurse -Filter 'ffprobe.exe' | Select-Object -First 1
          Copy-Item $ffmpegBin.FullName  "builds\electron\ffmpeg\ffmpeg.exe"
          Copy-Item $ffprobeBin.FullName "builds\electron\ffmpeg\ffprobe.exe"

          $fSize  = [math]::Round((Get-Item "builds\electron\ffmpeg\ffmpeg.exe").Length / 1MB, 1)
          $fpSize = [math]::Round((Get-Item "builds\electron\ffmpeg\ffprobe.exe").Length / 1MB, 1)
          Write-Host "[ok] ffmpeg.exe  = $fSize MB"
          Write-Host "[ok] ffprobe.exe = $fpSize MB"
          if ($fSize -lt 50) { throw "ffmpeg.exe too small ($fSize MB) — looks like a shim, not the real binary" }
          if ($fpSize -lt 50) { throw "ffprobe.exe too small ($fpSize MB) — looks like a shim" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: builds/electron/package-lock.json

      # Мініфікація index.html ПЕРЕД PyInstaller bundling.
      # html-minifier-terser стискає inline JS через Terser:
      #   • прибирає коментарі (мої пояснення)
      #   • перейменовує локальні змінні (a, b, c замість fileSize, hashAfter)
      #   • видаляє console.log
      #   • стискає whitespace
      # Це закриває атаку "Ctrl+U → readable code" — reverse-engineer буде
      # бачити нечитабельний код типу 'function a(b){return b.charCodeAt(0)}'.
      - name: Minify index.html
        shell: pwsh
        run: |
          npx --yes html-minifier-terser index.html `
            --collapse-whitespace `
            --remove-comments `
            --minify-js '{"compress":{"drop_console":true,"passes":2},"mangle":true}' `
            --minify-css true `
            -o index.html.min
          $orig = (Get-Item index.html).Length
          $mini = (Get-Item index.html.min).Length
          Move-Item -Force index.html.min index.html
          Write-Host "[minify] $orig bytes -> $mini bytes ($([math]::Round(($mini/$orig)*100,1))%)"

      - name: Build Windows installer
        run: builds\electron\build.bat
        shell: cmd

      - name: Upload Windows installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/SlengUniquifier_Setup_v${{ needs.resolve-version.outputs.version }}.exe

  # ── Mac .dmg ─────────────────────────────────────────────────────────────────
  build-mac:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync version into package.json and build_mac.sh
        run: |
          V="${{ needs.resolve-version.outputs.version }}"
          # package.json
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('builds/electron/package.json'));
            p.version = '$V';
            fs.writeFileSync('builds/electron/package.json', JSON.stringify(p, null, 2));
            const index = fs.readFileSync('index.html', 'utf8').replace(/id=\"versionBadge\">v[^<]+/, 'id=\"versionBadge\">v' + '$V');
            fs.writeFileSync('index.html', index);
          "

      - name: Create config.py from secrets
        run: |
          python3 - << 'EOF'
          import hashlib, os
          # SHA-256 хеш — щоб у .exe/.dmg не лежав plaintext-пароль
          pwd_hash = hashlib.sha256(os.environ["ADMIN_PASSWORD"].encode("utf-8")).hexdigest()
          print(f'[config] ADMIN_PASSWORD_HASH computed ({pwd_hash[:12]}...)')
          lines = [
              f'BOT_TOKEN           = "{os.environ["BOT_TOKEN"]}"',
              f'ADMIN_CHAT_ID       = "{os.environ["ADMIN_CHAT_ID"]}"',
              f'HMAC_SECRET         = "{os.environ["HMAC_SECRET"]}"',
              f'ADMIN_PASSWORD_HASH = "{pwd_hash}"',
          ]
          open("config.py", "w").write("\n".join(lines) + "\n")
          EOF
        env:
          BOT_TOKEN:      ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID:  ${{ secrets.ADMIN_CHAT_ID }}
          HMAC_SECRET:    ${{ secrets.HMAC_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip3 install pyinstaller pillow

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: builds/electron/package-lock.json

      # Мініфікація index.html (та сама що на Windows) — щоб inline JS
      # був нечитабельний у .dmg бандлі
      - name: Minify index.html
        run: |
          npx --yes html-minifier-terser index.html \
            --collapse-whitespace \
            --remove-comments \
            --minify-js '{"compress":{"drop_console":true,"passes":2},"mangle":true}' \
            --minify-css true \
            -o index.html.min
          mv index.html.min index.html
          ls -la index.html

      - name: Build Mac DMG
        run: bash builds/electron/build_mac.sh

      - name: Upload Mac DMG x64 (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-x64
          path: dist/mac/SlengUniquifier_v${{ needs.resolve-version.outputs.version }}_x64.dmg

      - name: Upload Mac DMG arm64 (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg-arm64
          path: dist/mac/SlengUniquifier_v${{ needs.resolve-version.outputs.version }}_arm64.dmg

  # ── Створюємо GitHub Release і оновлюємо latest.json (тільки при тегу) ──────
  release:
    needs: [resolve-version, build-windows, build-mac]
    if: needs.resolve-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # потрібно щоб робити commit з оновленим latest.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/ && find artifacts -type f

      - name: Extract release notes from tag message
        id: notes
        run: |
          # Стратегія:
          #   ANNOTATED тег (`git tag -a vX -m "..."`)   → беремо текст з -m, як написав
          #   LIGHTWEIGHT тег (`git tag vX`, для dev-iter) → generic user-friendly текст,
          #                                                  без технічних git-деталей
          #
          # Як перейти на student-mode (коли треба показувати реальні нотатки):
          #   git tag -a v1.1.0 -m "Що нового для юзера: ..."
          #   git push origin v1.1.0
          #
          # Дев-режим за замовчуванням ВЕСЬ ЧАС поки тегуєш як `git tag vX`.

          TAG="v${{ needs.resolve-version.outputs.version }}"
          TAG_TYPE=$(git cat-file -t "$TAG" 2>/dev/null || echo "")

          if [ "$TAG_TYPE" = "tag" ]; then
            # Annotated tag — публічні нотатки. Беремо тіло повідомлення
            # (без header — subject + body, без службової інфи).
            NOTES=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN/,/^-----END/d')
          else
            # Lightweight tag — dev-iter. Generic нотатки щоб юзер не бачив
            # 'fix CI fail — cache:pip потребував requirements.txt...'
            NOTES="Технічне оновлення та покращення стабільності."
          fi

          # Гарантуємо не-порожнє значення
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Технічне оновлення."
          fi

          echo "[notes] tag_type=$TAG_TYPE"
          echo "[notes] body:"
          echo "$NOTES" | head -10

          # Багаторядкові outputs у GitHub Actions через HEREDOC
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name:     Sleng Уніфікатор ${{ needs.resolve-version.outputs.version }}
          body:     ${{ steps.notes.outputs.notes }}
          draft:    false
          prerelease: false
          files: |
            artifacts/windows-installer/SlengUniquifier_Setup_v${{ needs.resolve-version.outputs.version }}.exe
            artifacts/mac-dmg-x64/SlengUniquifier_v${{ needs.resolve-version.outputs.version }}_x64.dmg
            artifacts/mac-dmg-arm64/SlengUniquifier_v${{ needs.resolve-version.outputs.version }}_arm64.dmg

      - name: Update latest.json (Windows)
        run: |
          V="${{ needs.resolve-version.outputs.version }}"
          NOTES=$(echo "${{ steps.notes.outputs.notes }}" | head -c 1000 | sed 's/"/\\"/g' | tr '\n' ' ')
          cat > latest.json << EOF
          {
            "version": "$V",
            "url":     "https://github.com/${{ github.repository }}/releases/download/v$V/SlengUniquifier_Setup_v$V.exe",
            "notes":   "$NOTES",
            "mac_x64":  "https://github.com/${{ github.repository }}/releases/download/v$V/SlengUniquifier_v${V}_x64.dmg",
            "mac_arm64":"https://github.com/${{ github.repository }}/releases/download/v$V/SlengUniquifier_v${V}_arm64.dmg"
          }
          EOF
          cat latest.json

      - name: Commit latest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull origin main
          git add latest.json
          git commit -m "Release v${{ needs.resolve-version.outputs.version }}: update latest.json" || echo "nothing to commit"
          git push origin main
