<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Sleng Унікалізатор</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  /* Сам splash — заокруглена «картка» з градієнтом + м'якою тінню */
  .splash {
    width: 100%; height: 100%;
    background:
      radial-gradient(circle at 30% 25%, rgba(255,138,0,.18), transparent 60%),
      radial-gradient(circle at 70% 80%, rgba(255,200,10,.12), transparent 65%),
      #0a0a0a;
    border-radius: 14px;
    border: 1px solid rgba(255,138,0,.18);
    box-shadow:
      0 18px 50px rgba(0,0,0,.65),
      inset 0 1px 0 rgba(255,180,40,.08);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    font-family: 'Segoe UI Variable', 'Segoe UI', -apple-system, sans-serif;
    -webkit-app-region: drag; /* перетягувати splash як native window */
  }

  /* Логотип — той самий що в main UI */
  .logo {
    width: 74px;
    height: 74px;
    object-fit: contain;
    filter: drop-shadow(0 6px 20px rgba(190,255,0,.34))
            drop-shadow(0 0 42px rgba(190,255,0,.16));
    animation: float 2.6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  .title {
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,.92);
    text-transform: uppercase;
    letter-spacing: .14em;
    margin-top: 2px;
  }

  /* Лоадер: 3 точки що пульсують */
  .loader { display: flex; gap: 5px; align-items: center; }
  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ffd60a, #ff7a00);
    box-shadow: 0 0 8px rgba(255,138,0,.6);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .30s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(.85); opacity: .55; }
    40%           { transform: scale(1.15); opacity: 1; }
  }

  .hint {
    font-size: 11px;
    color: rgba(255,255,255,.32);
    letter-spacing: .04em;
    margin-top: -2px;
  }
</style>
</head>
<body>
<div class="splash">
  <!-- Логотип-плеєр (точно як у main UI) -->
  <img class="logo" src="brand-logo.png" alt="" aria-hidden="true">

  <div class="title">Sleng Унікалізатор</div>

  <div class="loader">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <div class="hint">Запуск...</div>
</div>
</body>
</html>
